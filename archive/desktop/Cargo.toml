[package]
name = "culinary-desktop"
version = "1.0.0"
description = "Native desktop client for Culinary Alchemy (Steam)"
edition = "2021"

[[bin]]
name = "culinary-alchemy"
path = "src/main.rs"

[dependencies]
culinary-core = { path = "../core" }
eframe = "0.31"
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
directories = "5"
chrono = "0.4"
